# Reverse proxy for the FastAPI app. TLS / HTTP->HTTPS redirect is a later
# step; this listens on plain :80 only.

upstream weblog_api {
    server api:8000;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    location / {
        proxy_pass         http://weblog_api;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_redirect        off;
    }

    # nginx answers its own liveness without waking the app.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
