# Development overrides. Loaded automatically by `docker compose up` (no -f).
# Swaps api to the single-stage dev image with hot reload, bind-mounts the
# source tree, loads the dev .env, and publishes ports for host access.

services:
  api:
    image: weblog-api:dev
    build:
      context: ./api
      dockerfile: app/Dockerfile.dev
    command: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ./api/app/.env
    environment:
      # Apply migrations on start; prod uses a dedicated one-shot service.
      RUN_MIGRATIONS: "1"
    volumes:
      - ./api:/code
    ports:
      - "8000:8000"

  nginx:
    image: weblog-nginx:dev
    build:
      context: ./api/nginx
      dockerfile: Dockerfile.dev
    # Config is bind-mounted (not baked): edit and `docker compose restart nginx`.
    volumes:
      - ./api/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./api/nginx/conf.d:/etc/nginx/conf.d:ro

  db:
    ports:
      - "5432:5432"
