<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Blog Management</title>

    <meta
        name="description"
        content="Sign in to Blog Management to read, comment and manage your blog posts."
    >

    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial, sans-serif' font-weight='800' fill='white' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-brand">
                <span class="auth-badge">Blog Management</span>

                <h1>Welcome back</h1>

                <p>
                    Sign in to read blogs, leave comments,
                    and manage your account.
                </p>
            </div>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="username">
                        Username or email
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        placeholder="Enter your username or email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button
                    id="login-button"
                    class="primary-button"
                    type="submit"
                >
                    Login
                </button>

                <p
                    id="login-message"
                    class="form-message"
                    aria-live="polite"
                ></p>
            </form>

            <p class="auth-footer">
                New here?
                <a href="register.html">Create an account</a>
            </p>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
