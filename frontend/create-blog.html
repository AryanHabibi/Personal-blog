<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Blog | Blog Management</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <div>
            <h1>Create Blog</h1>
            <p id="page-user-message">Checking admin access...</p>
        </div>

        <nav class="header-actions">
            <a class="secondary-link" href="dashboard.html">
                Dashboard
            </a>

            <a class="secondary-link" href="index.html">
                View website
            </a>

            <button id="logout-button" type="button">
                Logout
            </button>
        </nav>
    </header>

    <main class="page-container">
        <section class="editor-card">
            <form
                id="create-blog-form"
                class="editor-form"
                enctype="multipart/form-data"
            >
                <div class="form-group">
                    <label for="title">Title</label>

                    <input
                        id="title"
                        name="title"
                        type="text"
                        minlength="3"
                        maxlength="200"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="content">Content</label>

                    <textarea
                        id="content"
                        name="content"
                        rows="12"
                        minlength="10"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="category-id">Category</label>

                    <select
                        id="category-id"
                        name="category_id"
                        required
                    >
                        <option value="">
                            Loading categories...
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="image">Featured image</label>

                    <input
                        id="image"
                        name="image"
                        type="file"
                        accept="image/jpeg,image/png,image/webp"
                    >
                </div>

                <button
                    id="create-blog-button"
                    class="primary-button"
                    type="submit"
                >
                    Create blog
                </button>

                <p
                    id="create-blog-message"
                    class="form-message"
                    aria-live="polite"
                ></p>
            </form>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/create-blog.js"></script>
</body>
</html>
