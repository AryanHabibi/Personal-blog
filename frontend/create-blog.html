<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Blog | Blog Management</title>

    <meta
        name="description"
        content="Publish a new article to Blog Management."
    >

    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial, sans-serif' font-weight='800' fill='white' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <a class="site-brand" href="index.html">
            <span class="brand-icon">B</span>

            <span>
                <strong>Blog Management</strong>
                <small>Create a new post</small>
            </span>
        </a>

        <nav class="header-actions">
            <a class="nav-link" href="dashboard.html">
                Dashboard
            </a>

            <a class="nav-link" href="index.html">
                View website
            </a>

            <button id="logout-button" class="outline-button" type="button">
                Logout
            </button>
        </nav>
    </header>

    <main class="page-container">
        <div class="page-heading">
            <h1>Create blog</h1>
            <p id="page-user-message">Checking admin access...</p>
        </div>

        <section class="editor-card">
            <form
                id="create-blog-form"
                class="editor-form"
                enctype="multipart/form-data"
            >
                <div class="form-group">
                    <label for="title">Title</label>

                    <input
                        id="title"
                        name="title"
                        type="text"
                        minlength="3"
                        maxlength="200"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="content">Content</label>

                    <textarea
                        id="content"
                        name="content"
                        rows="12"
                        minlength="10"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="category-id">Category</label>

                    <select
                        id="category-id"
                        name="category_id"
                        required
                    >
                        <option value="">
                            Loading categories...
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="image">Featured image</label>

                    <input
                        id="image"
                        name="image"
                        type="file"
                        accept="image/jpeg,image/png,image/webp"
                    >

                    <img
                        id="image-preview"
                        class="image-preview hidden"
                        alt="Selected image preview"
                    >
                </div>

                <button
                    id="create-blog-button"
                    class="primary-button"
                    type="submit"
                >
                    Create blog
                </button>

                <p
                    id="create-blog-message"
                    class="form-message"
                    aria-live="polite"
                ></p>
            </form>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/create-blog.js"></script>
</body>
</html>
