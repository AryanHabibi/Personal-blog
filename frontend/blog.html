<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Blog | Blog Management</title>

    <meta
        name="description"
        content="Read the full article and join the discussion in the comments."
    >

    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial, sans-serif' font-weight='800' fill='white' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <a class="site-brand" href="index.html">
            <span class="brand-icon">B</span>

            <span>
                <strong>Blog Management</strong>
                <small>Reading an article</small>
            </span>
        </a>

        <nav class="header-actions">
            <a class="nav-link" href="index.html">
                Home
            </a>

            <a
                id="dashboard-link"
                class="nav-link hidden"
                href="dashboard.html"
            >
                Dashboard
            </a>

            <button id="logout-button" class="outline-button hidden" type="button">
                Logout
            </button>
        </nav>
    </header>

    <main class="page-container">
        <div class="page-heading">
            <h1>Blog article</h1>
            <p id="blog-page-user">Loading account...</p>
        </div>

        <p id="blog-message" class="state-message">Loading blog...</p>

        <article id="blog-details" class="blog-details hidden">
            <img
                id="blog-image"
                class="blog-details-image hidden"
                alt=""
            >

            <div class="blog-details-content">
                <div class="blog-details-meta">
                    <span id="blog-category">
                        Uncategorized
                    </span>

                    <span id="blog-author"></span>

                    <span id="blog-views"></span>
                </div>

                <h2 id="blog-title"></h2>

                <p id="blog-date" class="blog-date"></p>

                <div id="blog-content" class="blog-body"></div>
            </div>
        </article>

        <section class="comments-section">
            <div class="section-heading">
                <div>
                    <h2>Comments</h2>
                    <p>Join the conversation.</p>
                </div>
            </div>

            <form id="comment-form" class="comment-form">
                <textarea
                    id="comment-content"
                    rows="4"
                    maxlength="1000"
                    placeholder="Write a comment..."
                    required
                ></textarea>

                <span id="comment-counter" class="char-counter">0 / 1000</span>

                <button
                    id="comment-button"
                    class="primary-button"
                    type="submit"
                >
                    Add comment
                </button>

                <p
                    id="comment-message"
                    class="form-message"
                    aria-live="polite"
                ></p>
            </form>

            <p id="comments-message" class="state-message">Loading comments...</p>

            <div id="comments-container" class="comments-list"></div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/blog.js"></script>
</body>
</html>
