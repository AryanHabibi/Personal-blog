<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Blog Management</title>

    <meta
        name="description"
        content="Create a Blog Management account to join the conversation."
    >

    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial, sans-serif' font-weight='800' fill='white' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <main class="auth-container">
        <section class="auth-card">

            <div class="auth-brand">
                <span class="auth-badge">
                    Blog Management
                </span>

                <h1>Create account</h1>

                <p>
                    Join the platform to read blogs
                    and leave comments.
                </p>
            </div>

            <form id="register-form" class="auth-form">

                <div class="form-group">
                    <label for="username">
                        Username
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Choose a username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button
                    id="register-button"
                    class="primary-button"
                    type="submit"
                >
                    Create account
                </button>

                <p
                    id="register-message"
                    class="form-message"
                    aria-live="polite"
                ></p>
            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
